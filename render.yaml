services:
  - type: web
    name: cadet-readiness-advisor
    runtime: python
    branch: master
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt && python ingestion/build_vector_db.py"
    startCommand: "streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: HF_HUB_DISABLE_IMPLICIT_TOKEN_WARNING
        value: "1"
      - key: TRANSFORMERS_VERBOSITY
        value: "error"
